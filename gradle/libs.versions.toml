[versions]
# ── Kotlin & Build ────────────────────────────────────────────────────────────
kotlin                      = "2.0.21"
ksp                         = "2.0.21-1.0.28"
agp                         = "8.7.3"

# ── AndroidX Core ─────────────────────────────────────────────────────────────
coreKtx                     = "1.15.0"
activityCompose             = "1.9.3"
lifecycleRuntimeKtx         = "2.8.7"

# ── Jetpack Compose ───────────────────────────────────────────────────────────
composeBom                  = "2024.12.01"

# ── Navegación ────────────────────────────────────────────────────────────────
navigationCompose           = "2.8.5"

# ── Splash API ────────────────────────────────────────────────────────────────
coreSplashscreen            = "1.0.1"

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt                        = "2.52"
hiltNavigationCompose       = "1.2.0"

# ── Room ──────────────────────────────────────────────────────────────────────
room                        = "2.6.1"

# ── Retrofit + OkHttp ─────────────────────────────────────────────────────────
retrofit                    = "2.11.0"
okhttpLogging               = "4.12.0"

# ── Firebase ──────────────────────────────────────────────────────────────────
firebaseBom                 = "33.7.0"
googleServices              = "4.4.2"       # plugin gradle

# ── Glide ─────────────────────────────────────────────────────────────────────
glide                       = "4.16.0"

# ── Coroutines ────────────────────────────────────────────────────────────────
coroutines                  = "1.9.0"

# ── Testing ───────────────────────────────────────────────────────────────────
junit                       = "4.13.2"
androidxJunit               = "1.2.1"
espresso                    = "3.6.1"
mockk                       = "1.13.13"
turbine                     = "1.2.0"       # testear StateFlow / Flow


[libraries]
# ── AndroidX Core ─────────────────────────────────────────────────────────────
androidx-core-ktx                   = { group = "androidx.core",      name = "core-ktx",                        version.ref = "coreKtx" }
androidx-activity-compose           = { group = "androidx.activity",  name = "activity-compose",                version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",           version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose= { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",     version.ref = "lifecycleRuntimeKtx" }

# collectAsStateWithLifecycle — requerido por consigna
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",       version.ref = "lifecycleRuntimeKtx" }

# ── Jetpack Compose BOM ───────────────────────────────────────────────────────
# El BOM fija las versiones de todo el ecosistema Compose automáticamente
androidx-compose-bom                = { group = "androidx.compose",   name = "compose-bom",                     version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",name = "ui-graphics" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",name = "ui-tooling-preview" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }

# ── Navegación ────────────────────────────────────────────────────────────────
androidx-navigation-compose         = { group = "androidx.navigation", name = "navigation-compose",             version.ref = "navigationCompose" }

# ── Splash API ────────────────────────────────────────────────────────────────
androidx-core-splashscreen          = { group = "androidx.core",      name = "core-splashscreen",               version.ref = "coreSplashscreen" }

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt-android                        = { group = "com.google.dagger",  name = "hilt-android",                    version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",  name = "hilt-android-compiler",           version.ref = "hilt" }
androidx-hilt-navigation-compose    = { group = "androidx.hilt",      name = "hilt-navigation-compose",         version.ref = "hiltNavigationCompose" }

# ── Room ──────────────────────────────────────────────────────────────────────
room-runtime                        = { group = "androidx.room",      name = "room-runtime",                    version.ref = "room" }
room-ktx                            = { group = "androidx.room",      name = "room-ktx",                        version.ref = "room" }
room-compiler                       = { group = "androidx.room",      name = "room-compiler",                   version.ref = "room" }

# ── Retrofit + OkHttp ─────────────────────────────────────────────────────────
retrofit                            = { group = "com.squareup.retrofit2", name = "retrofit",                    version.ref = "retrofit" }
retrofit-converter-gson             = { group = "com.squareup.retrofit2", name = "converter-gson",              version.ref = "retrofit" }
okhttp-logging                      = { group = "com.squareup.okhttp3",   name = "logging-interceptor",         version.ref = "okhttpLogging" }

# ── Firebase ──────────────────────────────────────────────────────────────────
# El BOM de Firebase fija versiones de todas las libs de Firebase
firebase-bom                        = { group = "com.google.firebase", name = "firebase-bom",                   version.ref = "firebaseBom" }
firebase-auth-ktx                   = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore-ktx              = { group = "com.google.firebase", name = "firebase-firestore-ktx" }

# ── Glide ─────────────────────────────────────────────────────────────────────
glide                               = { group = "com.github.bumptech.glide", name = "glide",                   version.ref = "glide" }

# ── Coroutines ────────────────────────────────────────────────────────────────
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "coroutines" }

# ── Testing ───────────────────────────────────────────────────────────────────
junit                               = { group = "junit",              name = "junit",                           version.ref = "junit" }
mockk                               = { group = "io.mockk",           name = "mockk",                           version.ref = "mockk" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",     version.ref = "coroutines" }
turbine                             = { group = "app.cash.turbine",   name = "turbine",                         version.ref = "turbine" }
androidx-junit                      = { group = "androidx.test.ext",  name = "junit",                           version.ref = "androidxJunit" }
androidx-espresso-core              = { group = "androidx.test.espresso", name = "espresso-core",               version.ref = "espresso" }

# ── Debug ─────────────────────────────────────────────────────────────────────
# Solo en debug builds (layout inspector de Compose)
androidx-ui-tooling                 = { group = "androidx.compose.ui",name = "ui-tooling" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",name = "ui-test-manifest" }

androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

[plugins]
# ── Build ─────────────────────────────────────────────────────────────────────
android-application     = { id = "com.android.application",                version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }


# ── KSP (Room + Hilt usan esto en lugar de kapt) ──────────────────────────────
ksp                     = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt                    = { id = "com.google.dagger.hilt.android",          version.ref = "hilt" }

# ── Firebase / Google Services ────────────────────────────────────────────────
google-services         = { id = "com.google.gms.google-services",          version.ref = "googleServices" }